[package]
name = "export-checkup"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Offline integrity checks and regression comparisons for personal data exports"
license = "MIT"
repository = "https://github.com/KanadeK/export-checkup"
homepage = "https://github.com/KanadeK/export-checkup"
readme = "README.md"
keywords = ["takeout", "backup", "privacy", "instagram", "archive"]
categories = ["command-line-utilities", "filesystem"]
exclude = [".github/", "target/", ".artifacts/"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "4.3", default-features = false, features = ["bzip2", "deflate-flate2-zlib-rs", "deflate64"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
